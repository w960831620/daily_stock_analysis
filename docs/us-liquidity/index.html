<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美股流动性看板</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#f5f7fb;font-family:Arial,'Microsoft YaHei',sans-serif;color:#111827}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#0f172a,#1e3a8a);color:white;padding:26px;border-radius:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}.card,.panel{background:white;border-radius:18px;padding:18px;box-shadow:0 10px 28px #0001}.big{font-size:28px;font-weight:800;margin:8px 0}.panel{margin-top:18px}.tag{display:inline-block;background:#e2e8f0;color:#0f172a;border-radius:999px;padding:6px 10px;margin:8px 8px 0 0}.ok{border-left:8px solid #16a34a}.mid{border-left:8px solid #f59e0b}.bad{border-left:8px solid #dc2626}small{color:#64748b}li{margin:7px 0}</style></head><body><div class="wrap"><div class="hero"><h1>美股流动性看板</h1><div>网页版自动更新：页面打开后自动拉取 FRED 与 Yahoo Finance 数据，每30分钟刷新一次。</div><span class="tag" id="mode">loading</span><span class="tag" id="time"></span></div><div id="cards" class="grid"></div><div id="view" class="panel"><h2 id="bias">计算中...</h2><ul id="reasons"></ul></div><div class="panel"><canvas id="chart" height="130"></canvas></div><p><small>净流动性 = WALCL - WTREGEN - RRPONTSYD。该页用于趋势监控，不构成投资建议。</small></p></div><script>const proxy=u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u);let chart;async function csv(code){let t=await fetch(proxy('https://fred.stlouisfed.org/graph/fredgraph.csv?id='+code)).then(r=>r.text());let a=t.trim().split(/\n/).slice(1).map(x=>x.split(','));return a.map(x=>({d:x[0],v:+x[1]})).filter(x=>isFinite(x.v));}async function yf(tk){let u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(tk)+'?range=2y&interval=1d';let j=await fetch(proxy(u)).then(r=>r.json());let r=j.chart.result[0],ts=r.timestamp,q=r.indicators.quote[0].close;return ts.map((x,i)=>({d:new Date(x*1000).toISOString().slice(0,10),v:q[i]})).filter(x=>x.v);}function last(a){return a[a.length-1].v}function chg(a,n){return a.length>n?last(a)-a[a.length-n].v:0}function ma(a,n){let b=a.slice(-n).map(x=>x.v);return b.reduce((s,x)=>s+x,0)/b.length}function card(k,v,n=''){return `<div class="card"><b>${k}</b><div class="big">${v}</div><small>${n}</small></div>`}async function load(){try{let [walcl,tga,rrp,nfci,sofr,iorb,spy,qqq,vix,btc]=await Promise.all([csv('WALCL'),csv('WTREGEN'),csv('RRPONTSYD'),csv('NFCI'),csv('SOFR'),csv('IORB'),yf('SPY'),yf('QQQ'),yf('^VIX'),yf('BTC-USD')]);let n=Math.min(walcl.length,tga.length,rrp.length),net=[];for(let i=0;i<n;i++)net.push({d:walcl[walcl.length-n+i].d,v:walcl[walcl.length-n+i].v-tga[tga.length-n+i].v-rrp[rrp.length-n+i].v*1000});let spyP=last(spy),qqqP=last(qqq),btcP=last(btc),vixP=last(vix),spyMA=ma(spy,50),qqqMA=ma(qqq,50),btcMA=ma(btc,50),net4=chg(net,4),net13=chg(net,13),nfci4=chg(nfci,4),spread=last(sofr)-last(iorb);let score=50,rs=[];function add(ok,pts,g,b){score+=ok?pts:-pts;rs.push(ok?g:b)}add(net4>0,15,'净流动性4周上升','净流动性4周下降');add(net13>0,10,'净流动性13周改善','净流动性13周走弱');add(spyP>=spyMA,10,'SPY强于50日线','SPY弱于50日线');add(qqqP>=qqqMA,10,'QQQ强于50日线','QQQ弱于50日线');add(nfci4<0,10,'NFCI下降，金融条件放松','NFCI上升，金融条件收紧');add(btcP>=btcMA,5,'BTC强于50日线','BTC弱于50日线');if(vixP<20){score+=5;rs.push('VIX低于20')}else if(vixP>30){score-=15;rs.push('VIX高于30')}else{score-=5;rs.push('VIX高于20')}if(spread<.05){score+=5;rs.push('SOFR-IORB压力不明显')}else if(spread>.15){score-=10;rs.push('SOFR-IORB扩大')}score=Math.max(0,Math.min(100,Math.round(score)));let cls=score>=70?'ok':score>=40?'mid':'bad',light=score>=70?'🟢 Bullish / 偏多':score>=40?'🟡 Neutral / 中性':'🔴 Bearish / 偏空';document.getElementById('view').className='panel '+cls;document.getElementById('bias').textContent='SPX/SPY未来1-4周倾向：'+light;document.getElementById('reasons').innerHTML=rs.map(x=>'<li>'+x+'</li>').join('');document.getElementById('cards').innerHTML=[card('综合评分',score+'/100',light),card('红黄绿灯',light),card('净流动性4周变化',(net4/1000).toFixed(0)+' 十亿美元'),card('SPY趋势',spyP>=spyMA?'多头':'空头',spyP.toFixed(2)+' / 50MA '+spyMA.toFixed(2)),card('QQQ趋势',qqqP>=qqqMA?'多头':'空头',qqqP.toFixed(2)+' / 50MA '+qqqMA.toFixed(2)),card('VIX',vixP.toFixed(2)),card('NFCI',last(nfci).toFixed(2),'4周变化 '+nfci4.toFixed(2)),card('BTC趋势',btcP>=btcMA?'多头':'空头',btcP.toFixed(0)+' / 50MA '+btcMA.toFixed(0))].join('');document.getElementById('mode').textContent='Live Mode';document.getElementById('time').textContent='更新时间 '+new Date().toLocaleString();let labels=net.slice(-180).map(x=>x.d),netv=net.slice(-180).map(x=>x.v/1000000),spyv=spy.slice(-180).map(x=>x.v);if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels,datasets:[{label:'Net Liquidity, $tn',data:netv,yAxisID:'y'},{label:'SPY',data:spyv,yAxisID:'y1'}]},options:{responsive:true,interaction:{mode:'index',intersect:false},scales:{y:{position:'left'},y1:{position:'right',grid:{drawOnChartArea:false}}}}});}catch(e){document.getElementById('mode').textContent='数据拉取失败：'+e.message;}}load();setInterval(load,30*60*1000);</script></body></html>
